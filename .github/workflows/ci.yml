name: Foundation validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Quality, build, and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

      - name: Check representative production response budgets
        run: |
          pnpm start > "${RUNNER_TEMP}/gobiverse-production.log" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          pnpm perf:check

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run desktop and mobile smoke tests
        run: pnpm test:e2e

      - name: Capture desktop and mobile review screenshots
        run: |
          pnpm dev > "${RUNNER_TEMP}/gobiverse-screenshots.log" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          SCREENSHOT_OUTPUT_DIR="${RUNNER_TEMP}/gobiverse-screenshots" pnpm screenshots

      - name: Upload review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: foundation-review-screenshots
          path: ${{ runner.temp }}/gobiverse-screenshots
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  <g id="LOGO"><image x="750" y="1217" width="255" height="86" preserveAspectRatio="xMidYMid meet" xlink:href="../../assets/brand/gobi88-logo-official.png"/><text x="60" y="1270" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#071B2E">CTA / SERIES LABEL</text></g>
  <g id="GUIDES" fill="none" stroke="#D92720" stroke-width="2" stroke-dasharray="12 12" opacity=".45"><rect x="76" y="76" width="928" height="1198" rx="8"/></g>
